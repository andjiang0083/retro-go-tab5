# 架构门禁（不需 ESP-IDF，秒级）：显示驱动契约
#   显示驱动契约 —— 三份 Tab5 驱动各自的 8 个 lcd_* 定义齐全 + 挂了签名钉
# 为什么单独一个 workflow：build.yml 守的是"能不能编 + 产物对不对"，
# 而这道是**接口契约**，与具体构建形态无关，且不该拖到构建之后才红。
#
# 退役说明（2026-10-22）：本仓只维护 Tab5 之后，R1「共享层不许出现板名」隔离门禁失去意义
# （它是双板时代防漂移的棘轮），已随 tools/check-board-isolation.py 一并退役；
# Claw4 独立仓若要继续该门禁，从 git 历史里取回即可。
name: architecture gates

on:
  push:
    branches: ['main', 'trunk', 'p2/**', 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: Display contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 显示驱动契约门禁（三份驱动 × 8 个 lcd_*）
        run: python3 tools/check-display-contract.py .
