# .github/workflows/build.yml — retro-go-tab5 构建回归门禁
#
# 职责（只有这两件）：
#   1) 干净克隆 + 全量构建能成功（--no-networking；增量构建会掩盖 P4 无射频的配置错误）
#   2) 产物是「真的 merged 镜像」（三个结构锚点）+ IDF 版本与仓库记录一致
# 不做：不验证帧率/显示通路/崩溃（无硬件，靠真机看屏 + SD 卡 /crash.log）；不做发布（M5Burner 手动）。
# 禁止：continue-on-error / 跳过步骤 / 放宽门禁来换绿。
#
# 本文件里所有路径、命令、锚点均由 2026-10-07 的实测支撑：
#   - 干净克隆构建成功：退出码 0、70 秒（18 核）／5.5.4 上 132 秒，两者产物均为 VALID
#   - 产物真实路径：retro-go-p4/retro-go_<版本>_tab5.img（不是文档里写的 build/tab5-retro-go.img）
#   - 三锚点：0x2000=E9 / 0x8000=50AA / 0x10020=ABCD5432（与本地发布门禁脚本的判定逐条一致）
#   - 构建会改被跟踪的 */dependencies.lock（记录 IDF 版本）→ 反过来当「环境一致性」门禁用

name: build-tab5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: build-tab5-${{ github.ref }}
  cancel-in-progress: false   # 保留每次 run 的产物留痕；只在磁盘/分钟数吃紧时才考虑 true

env:
  # 与开发树 tools/idf-env.sh（~/esp/esp-idf-v5.5 = 5.5.2）一致。
  # 5.5.4 上也能构建成功，但产出字节不同，且会把 dependencies.lock 改写成 5.5.4 —— 门禁会因此变红，这是有意的。
  IDF_VERSION: "v5.5.2"

jobs:
  build-tab5:
    name: Build + structure gate (Tab5)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 0. checkout：必须带全部 tag ─────────────────────────────────────
      # rg_tool.py 用 `git describe --tags --abbrev=5 --dirty --always` 生成 RG_PROJECT_VER 与镜像文件名。
      # 默认 fetch-depth:1 下该命令只返回裸 commit hash（实测：tags=0、describe 报 No names found）。
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. ESP-IDF v5.5.2（官方 action，基于 EIM）───────────────────────
      # 已核实（读 action 源码 + 本机实跑 eim 激活脚本）：它会把 activate_*.sh -e 的输出按 KEY=VALUE
      # 解析并用 core.exportVariable() 写入 GITHUB_ENV ⇒ IDF_PATH 在后续 step 可用。
      # 注意：Linux 默认安装路径是 /tmp/esp/idf（README 写的 /opt/esp/idf 与源码不符）。
      # 供应链：该 action 的 v1 是**分支**不是 tag，稳定后再 pin 到 commit SHA。
      - name: Install ESP-IDF ${{ env.IDF_VERSION }}
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}

      # 无缓存版本（P1）。工具链缓存要放在 install **之前**才有意义，而 EIM 在目标目录已存在时
      # 是否会短路未验证 —— 留到第二次迭代实测（先量耗时，再决定缓存策略）。

      # ── 2. 环境自检：宁可显式红，不要猜路径 ──────────────────────────────
      - name: Assert ESP-IDF environment
        run: |
          set -euo pipefail
          [ -n "${IDF_PATH:-}" ] || { echo "::error::IDF_PATH 未被导出（action 行为变了）"; exit 1; }
          echo "IDF_PATH=$IDF_PATH"
          [ -x "$IDF_PATH/tools/idf.py" ] || { echo "::error::$IDF_PATH/tools/idf.py 不存在"; exit 1; }
          command -v idf.py || echo "::warning::PATH 里没有 idf.py（rg_tool.py 需要能直接调用它）"
          idf.py --version || true
          PATCH=$(sed -n 's/.*set(IDF_VERSION_PATCH \([0-9]*\)).*/\1/p' "$IDF_PATH/tools/cmake/version.cmake")
          echo "IDF_VERSION_PATCH=$PATCH"
          # ESP_IDF_VERSION 只有主次版本（实测输出 5.5），断言补丁号必须读 version.cmake
          [ "$PATCH" = "2" ] || { echo "::error::期望 IDF 5.5.2，实际 patch=$PATCH"; exit 1; }
          riscv32-esp-elf-gcc --version | head -n1

      # ── 3. 全量构建 ─────────────────────────────────────────────────────
      - name: Build merged image (launcher + gbsp)
        working-directory: retro-go-p4
        run: |
          set -euo pipefail
          # partitions.* 是构建期生成物（被 retro-go-p4/.gitignore 忽略），先删掉强制重建
          rm -f partitions.csv partitions.bin
          # --no-networking 必填：P4 无射频，sdkconfig 无 CONFIG_ESP_WIFI_*；增量构建会掩盖该错。
          # set -o pipefail 已保证管道中构建失败会让本 step 变红（无需再取 PIPESTATUS）。
          python3 rg_tool.py --target tab5 --no-networking build-img launcher gbsp 2>&1 | tee ../build-tab5.log

      # ── 4. 门禁：产物是真 merged（内联断言，不依赖仓库外工具）────────────
      # 与本地发布门禁脚本的判定逐条一致（已用 5 个真实文件比对过：
      # 干净克隆构建的 merged、发布件 0.4.7 merged → VALID；截断镜像、抹锚点镜像、
      # 真·单 app bin → INVALID）。这里内联是为了不在仓内新增第二份"共享工具"，避免双副本漂移。
      - name: Structure gate (merged image anchors)
        working-directory: retro-go-p4
        run: |
          set -euo pipefail
          IMG=$(ls retro-go_*_tab5.img | head -n1)
          [ -n "$IMG" ] || { echo "::error::没找到 retro-go_*_tab5.img"; ls -la; exit 1; }
          [ -s launcher/build/launcher.bin ] || { echo "::error::launcher.bin 缺失"; exit 1; }
          [ -s gbsp/build/gbsp.bin ] || { echo "::error::gbsp.bin 缺失"; exit 1; }
          echo "merged image: $IMG ($(stat -c%s "$IMG") bytes)"
          python3 -c "import sys;d=open(sys.argv[1],'rb').read();A=[(0x2000,b'\xe9'),(0x8000,b'\xaa\x50'),(0x10020,(0xABCD5432).to_bytes(4,'little'))];bad=[hex(o) for o,m in A if d[o:o+len(m)]!=m];ok=len(d)>=524288 and not bad;print('VALID' if ok else 'INVALID size=%d bad_anchors=%s'%(len(d),bad));sys.exit(0 if ok else 1)" "$IMG"
          shasum -a 256 "$IMG" launcher/build/launcher.bin gbsp/build/gbsp.bin | tee ../SHA256SUMS.txt

      # ── 5. 门禁：CI 的 IDF 版本必须与仓库记录一致 ──────────────────────
      # 构建会把被跟踪的 */dependencies.lock 里的 idf.version 写成当前 IDF 版本。
      # 用 v5.5.2 构建 ⇒ 该文件不变（实测：5.5.2 构建后工作区干净；5.5.4 会改成 5.5.4）。
      # 所以「lock 没被动过」==「CI 环境和仓库记录是同一个 IDF」，白捡的一致性门禁。
      - name: Assert IDF version matches dependencies.lock
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- '*/dependencies.lock'; then
            echo "::error::dependencies.lock 被改写 ⇒ CI 实际用的 IDF 与仓库记录不一致（见上方 diff）"
            exit 1
          fi
          echo "dependencies.lock 未被改写：CI 的 IDF 与仓库记录一致"

      # ── 6. 上传产物（含 SHA256SUMS）──────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tab5-fw-${{ github.run_number }}-${{ github.sha }}
          path: |
            retro-go-p4/retro-go_*_tab5.img
            retro-go-p4/launcher/build/launcher.bin
            retro-go-p4/gbsp/build/gbsp.bin
            SHA256SUMS.txt
            build-tab5.log
          if-no-files-found: warn   # 构建失败时可能确实没产物；上传步骤本身不该变成第二个红点

      # ── 7. 观测（不改结论）：磁盘与耗时，供下一轮决定是否上缓存 ───────────
      - name: Disk + timing report
        if: always()
        run: |
          df -h / || true
          du -sh retro-go-p4/launcher/build retro-go-p4/gbsp/build "${IDF_PATH:-/tmp}" 2>/dev/null || true
          tail -n 30 build-tab5.log 2>/dev/null || true
